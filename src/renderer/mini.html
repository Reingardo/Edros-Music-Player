<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MusicPlayer mini</title>
<style>
  :root { --accent: #ff5c8a; --accent2: #ffb347; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 13px/1.35 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #eef0f5; user-select: none; }
  .card { position: absolute; inset: 0; border-radius: 14px; background: rgba(16, 18, 25, .96); border: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: 12px; padding: 10px 10px 14px; -webkit-app-region: drag; overflow: hidden; }
  .bg { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(28px) brightness(.35) saturate(1.3); opacity: .9; z-index: 0; }
  .card > *:not(.bg) { position: relative; z-index: 1; }
  .art { width: 62px; height: 62px; border-radius: 9px; background: #1c2030 center/cover no-repeat; flex: none; display: grid; place-items: center; color: #6b7183; font-size: 24px; }
  .txt { flex: 1; min-width: 0; }
  .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .a { color: #a4aabb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .btns { display: flex; align-items: center; gap: 2px; margin-top: 4px; -webkit-app-region: no-drag; }
  button { -webkit-app-region: no-drag; background: none; border: 0; color: #cfd3de; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; }
  button:hover { background: rgba(255,255,255,.1); color: #fff; }
  button svg { width: 17px; height: 17px; }
  .play { width: 34px; height: 34px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
  .play:hover { background: linear-gradient(135deg, var(--accent), var(--accent2)); filter: brightness(1.1); }
  .corner { position: absolute !important; top: 6px; right: 6px; display: flex; gap: 0; }
  .corner button { width: 24px; height: 24px; color: #8b91a3; }
  .corner svg { width: 14px; height: 14px; }
  .bar { position: absolute !important; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.08); }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
</style>
</head>
<body>
<div class="card">
  <div class="bg" id="bg"></div>
  <div class="art" id="art">♪</div>
  <div class="txt">
    <div class="t" id="t">MusicPlayer</div>
    <div class="a" id="a"></div>
    <div class="btns">
      <button id="prev" title="⏮"><svg viewBox="0 0 24 24"><path d="M19 4.5v15a1 1 0 0 1-1.5.86l-10-7.5a1 1 0 0 1 0-1.72l10-7.5A1 1 0 0 1 19 4.5z" fill="currentColor"/><path d="M5 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="play" class="play"></button>
      <button id="next" title="⏭"><svg viewBox="0 0 24 24"><path d="M5 4.5v15a1 1 0 0 0 1.5.86l10-7.5a1 1 0 0 0 0-1.72l-10-7.5A1 1 0 0 0 5 4.5z" fill="currentColor"/><path d="M19 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button id="fav"></button>
    </div>
  </div>
  <div class="corner">
    <button id="expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <button id="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="bar"><div id="prog"></div></div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const P = '<svg viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.2-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z" fill="currentColor"/></svg>';
  const PA = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/></svg>';
  const H = (on) => `<svg viewBox="0 0 24 24" fill="${on ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
  let S = null;
  window.mini.onState((s) => {
    S = s; S.at = Date.now();
    document.documentElement.style.setProperty('--accent', s.accent || '#ff5c8a');
    document.documentElement.style.setProperty('--accent2', s.accent2 || '#ffb347');
    const c = s.current;
    $('t').textContent = c ? c.title : 'MusicPlayer';
    $('a').textContent = c ? (c.artist || '') : '';
    const img = c ? c.art : '';
    $('art').style.backgroundImage = img ? `url("${img}")` : '';
    $('art').textContent = img ? '' : '♪';
    $('bg').style.backgroundImage = img ? `url("${img}")` : '';
    $('play').innerHTML = s.paused ? P : PA;
    $('fav').innerHTML = H(s.fav);
    $('fav').style.color = s.fav ? 'var(--accent)' : '';
  });
  (function tick() {
    requestAnimationFrame(tick);
    if (!S || !S.duration) { $('prog').style.width = '0'; return; }
    const t = Math.min(S.duration, S.time + (S.paused ? 0 : (Date.now() - S.at) / 1000));
    $('prog').style.width = (t / S.duration * 100) + '%';
  })();
  $('play').onclick = () => window.mini.cmd({ action: 'toggle' });
  $('next').onclick = () => window.mini.cmd({ action: 'next' });
  $('prev').onclick = () => window.mini.cmd({ action: 'prev' });
  $('fav').onclick = () => window.mini.cmd({ action: 'fav' });
  $('close').onclick = () => window.mini.close();
  $('expand').onclick = () => window.mini.expand();
})();
</script>
</body>
</html>
